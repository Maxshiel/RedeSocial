<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

</head>
<body>
    <form action="login">

        Usuario <input type="text" id="usuario">

        Senha <input type="password" id="senha">

        <button type="button" onclick="fazerLogin()">Enviar</button>

    </form>

    <script>

    function criarCookie(nome, valor, expira){
    var dtExpira = "expires="+expira;
    document.cookie = nome + "=" + valor + ";" + dtExpira;
    //cookie final = nomeUsuario=nome; expires= Tue, 01 Jan 2115 120000 UTC 
    }
    
    function fazerLogin() {
    var usuario = document.getElementById("usuario").value;
    var senha = document.getElementById("senha").value;

    if (usuario == "admin" && senha == "1234") {
        criarCookie("usuarioLogado", usuario, 1);

        window.location.href = "parteinicial.html";
    } else {
        alert("Usuário ou senha incorretos!");
    }
    }

</script>
    
</body>
</html>
