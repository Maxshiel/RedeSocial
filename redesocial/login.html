<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

</head>
<body>

    FAÇA O LOGIN!

    <form action="login">

        Usuario <input type="text" id="usuariodig">

        Senha <input type="password" id="senhadig">

        <button type="button" onclick="fazerLogin()">Enviar</button>

    </form>

    <script>

    function criarCookie(nome, valor, expira){
    var dtExpira = "expires="+expira;
    document.cookie = nome + "=" + valor + ";" + dtExpira;
    //cookie final = nomeUsuario=nome; expires= Tue, 01 Jan 2115 120000 UTC 
    }

    function lerCookie(nome) {
    var vnome = nome + "=";
    var ca = document.cookie.split(';');

    for (var i = 0; i < ca.length; i++) {
        var c = ca[i].trim();

        if (c.indexOf(vnome) == 0) {
            return c.substring(vnome.length, c.length);
        }
    }

    return "";
    }
    
    function fazerLogin() {
    var usuariodig = document.getElementById("usuariodig").value;
    var senhadig = document.getElementById("senhadig").value;

    var usuariocasd = lerCookie("usuario");
    var senhacasd = lerCookie("senha");

    if (usuariodig == usuariocasd && senhadig == senhacasd) {
        criarCookie("usuarioLogado", usuariodig, 1);

        window.location.href = "parteinicial.html";
    } else {
        alert("Usuário ou senha incorretos!");
    }
    }

</script>
    
</body>
</html>
